services:
  - name: mathboard-backend
    type: web
    runtime: python
    rootDir: ./src
    buildCommand: pip install -r requirements.txt
    # Deliberately a single plain uvicorn process - no --workers/gunicorn.
    # ydoc_room.py's room registry is an in-process dict; splitting it
    # across workers or instances would split-brain collaborators who land
    # on different processes instead of sharing one document's live state.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: mathboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/mathboard.db
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
