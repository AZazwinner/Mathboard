name: Images

# Every pull request builds and scans both images. A push to main (or a v* tag) also publishes them to
# GitHub Container Registry, and a push to main then bumps the tag in deploy/gitops/values-kind.yaml,
# which is what Argo CD deploys.
on:
  pull_request:
    paths:
      - src/**
      - app/**
      - .github/workflows/images.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mathboard-backend
            context: src
            build_args: ""
          - name: mathboard-frontend
            context: app
            # The frontend bakes these URLs in at build time. This image is for the local kind cluster
            # (see deploy/kind), where the app is served at app.localhost:8080. The production frontend
            # is built by Vercel with its own values.
            build_args: |
              NEXT_PUBLIC_API_URL=http://api.localhost:8080
              NEXT_PUBLIC_WS_URL=ws://api.localhost:8080
              NEXT_PUBLIC_APP_URL=http://app.localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry paths must be lowercase, and the account name isn't.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Build once, load it into the local Docker daemon and scan it before anything is published.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: runtime
          build-args: ${{ matrix.build_args }}
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fails the build on a HIGH or CRITICAL vulnerability that has a fix available.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layers from the build above, and adds provenance and an SBOM as attestations.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: runtime
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

  gitops:
    name: Point the cluster at the new images
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the image tags
        env:
          TAG: sha-${{ github.sha }}
        run: |
          # Same 7 characters docker/metadata-action uses for its sha- tag.
          TAG="${TAG:0:11}" yq -i '
            .backend.image.tag = strenv(TAG) |
            .frontend.image.tag = strenv(TAG)
          ' deploy/gitops/values-kind.yaml
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA:0:7} to the kind cluster [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
