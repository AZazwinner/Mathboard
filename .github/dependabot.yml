version: 2
updates:
  # Keeps the pinned commit of every GitHub Action current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /src
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Vitest 5 is a major migration; take it deliberately, not from a bot PR.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /src
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node releases are short-lived and never become LTS.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x"]
