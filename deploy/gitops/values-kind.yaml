# What Argo CD deploys to the kind cluster: the chart in deploy/helm/mathboard with these values.
#
# The image tags below are rewritten by the "Images" workflow on every push to main, so a merged change
# reaches the cluster without anyone running a command. Edit anything else by hand and Argo CD applies it.
backend:
  image:
    repository: ghcr.io/azazwinner/mathboard-backend
    tag: sha-4db491f
    pullPolicy: IfNotPresent
frontend:
  image:
    repository: ghcr.io/azazwinner/mathboard-frontend
    tag: sha-4db491f
    pullPolicy: IfNotPresent
config:
  appUrl: http://app.localhost:8080
  corsOrigins:
    - http://app.localhost:8080
# Argo CD renders the chart without access to the cluster, so the chart can't read back a generated key
# to keep it stable. argocd.sh creates this Secret once instead.
existingSecret: mathboard-app
