apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mathboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AZazwinner/Mathboard.git
    targetRevision: main
    path: deploy/helm/mathboard
    helm:
      releaseName: mathboard
      valueFiles:
        - ../../gitops/values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # The autoscaler (or kubectl scale) owns the replica count, not git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: mathboard-backend
      jsonPointers:
        - /spec/replicas
