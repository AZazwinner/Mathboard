backend:
  image:
    repository: mathboard-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 3
  port: 12001
  dbPoolSize: 5
  dbMaxOverflow: 5
  terminationGracePeriodSeconds: 40
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

# Metrics are served on their own port, which the gateway never routes to, and found by Prometheus
# through the prometheus.io/* pod annotations.
metrics:
  enabled: true
  port: 9100

# Scales the backend on open WebSocket connections. Needs KEDA and Prometheus installed first
# (bash deploy/kind/observability.sh up); the chart does not install them. While this is on,
# backend.replicas is ignored: KEDA owns the replica count.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  connectionsPerReplica: 50
  fallbackReplicas: 3
  prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9.1-alpine
    pullPolicy: IfNotPresent
  maxMemory: 256mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 320Mi

frontend:
  image:
    repository: mathboard-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 12000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

config:
  appUrl: http://app.localhost:8080
  corsOrigins:
    - http://app.localhost:8080

database:
  secretName: mathboard-db-app
  secretKey: uri
  maxConnections: 200

secretKey: ""

# Name of a Secret you create yourself with a SECRET_KEY entry. Set this when the chart is rendered
# without cluster access, as GitOps tools like Argo CD do: the chart's own Secret keeps its generated
# key stable across upgrades by reading the live Secret, which is impossible there.
existingSecret: ""

gateway:
  enabled: true
  name: mathboard-gateway
  appHost: app.localhost
  apiHost: api.localhost
