backend:
  image:
    repository: mathboard-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 3
  port: 12001
  dbPoolSize: 5
  dbMaxOverflow: 5
  terminationGracePeriodSeconds: 40
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9.1-alpine
    pullPolicy: IfNotPresent
  maxMemory: 256mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 320Mi

frontend:
  image:
    repository: mathboard-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 12000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

config:
  appUrl: http://app.localhost:8080
  corsOrigins:
    - http://app.localhost:8080

database:
  secretName: mathboard-db-app
  secretKey: uri
  maxConnections: 200

secretKey: ""

gateway:
  enabled: true
  name: mathboard-gateway
  appHost: app.localhost
  apiHost: api.localhost
