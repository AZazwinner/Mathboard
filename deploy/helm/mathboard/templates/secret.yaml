{{- $name := include "mathboard.appSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mathboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secretKey }}
  SECRET_KEY: {{ .Values.secretKey | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "SECRET_KEY") }}
  SECRET_KEY: {{ index $existing.data "SECRET_KEY" | quote }}
  {{- else }}
  SECRET_KEY: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
