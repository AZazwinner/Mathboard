apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "mathboard.labels" . | nindent 4 }}
data:
  APP_URL: {{ .Values.config.appUrl | quote }}
  CORS_ORIGINS: {{ join "," .Values.config.corsOrigins | quote }}
  DB_POOL_SIZE: {{ .Values.backend.dbPoolSize | quote }}
  DB_MAX_OVERFLOW: {{ .Values.backend.dbMaxOverflow | quote }}
  PORT: {{ .Values.backend.port | quote }}
