{{- $worstCase := mul (int (include "mathboard.maxBackendReplicas" .)) (add (int .Values.backend.dbPoolSize) (int .Values.backend.dbMaxOverflow)) -}}
{{- if gt $worstCase (int .Values.database.maxConnections) -}}
{{- fail (printf "the most backend replicas x (dbPoolSize + dbMaxOverflow) = %d, which exceeds the database's max_connections (%d). Lower the pool, or raise max_connections in the Postgres cluster and database.maxConnections here." $worstCase (int .Values.database.maxConnections)) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "mathboard.labels" . | nindent 4 }}
data:
  APP_URL: {{ .Values.config.appUrl | quote }}
  CORS_ORIGINS: {{ join "," .Values.config.corsOrigins | quote }}
  DB_POOL_SIZE: {{ .Values.backend.dbPoolSize | quote }}
  DB_MAX_OVERFLOW: {{ .Values.backend.dbMaxOverflow | quote }}
  PORT: {{ .Values.backend.port | quote }}
  {{- if .Values.metrics.enabled }}
  METRICS_PORT: {{ .Values.metrics.port | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  VALKEY_URL: {{ printf "redis://%s-valkey:6379/0" .Release.Name | quote }}
  {{- end }}
