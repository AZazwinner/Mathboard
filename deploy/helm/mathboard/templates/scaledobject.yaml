{{- if .Values.autoscaling.enabled }}
{{- /* KEDA creates and drives a HorizontalPodAutoscaler from this. The metric is the total number of open WebSockets across all replicas, and the HPA keeps the average per replica near connectionsPerReplica. */}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "mathboard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}-backend
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: 15
  # If Prometheus can't be queried, hold a safe size rather than guess.
  fallback:
    failureThreshold: 3
    replicas: {{ .Values.autoscaling.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
        # Removing a replica drops its WebSockets (clients reconnect on their own, but it's still a blip), so shrink slowly and only after the load has stayed low.
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheusAddress | quote }}
        query: sum(mathboard_websocket_connections)
        threshold: {{ .Values.autoscaling.connectionsPerReplica | quote }}
{{- end }}
