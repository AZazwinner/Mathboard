{{- if gt (int .Values.backend.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "mathboard.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "mathboard.selector" (dict "component" "backend" "root" .) | nindent 6 }}
{{- end }}
