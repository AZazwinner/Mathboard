# Deliberately small: one server, short retention, nothing persisted. This is for watching a demo or a
# load test on a laptop, not for keeping history.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  retention: 6h
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Keep only what the dashboard uses: the backend pods (found through their prometheus.io/* annotations),
# per-container CPU and memory from the kubelet, and Prometheus itself.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

# Evaluated and shown on Prometheus's Alerts page. There is no Alertmanager, so nothing is sent anywhere.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: mathboard
        rules:
          - alert: BackendDown
            expr: up{job="kubernetes-pods", app_kubernetes_io_component="backend"} == 0
            for: 1m
            annotations:
              summary: "Prometheus cannot scrape backend pod {{ $labels.pod }}"
          - alert: EventLoopLagging
            expr: histogram_quantile(0.95, sum by (le, pod) (rate(mathboard_event_loop_lag_seconds_bucket[2m]))) > 0.25
            for: 2m
            annotations:
              summary: "{{ $labels.pod }} is running its event loop more than 250 ms late, so it is saturated"
          - alert: DocumentFlushFailing
            expr: increase(mathboard_document_flush_errors_total[5m]) > 0
            annotations:
              summary: "{{ $labels.pod }} failed to save documents to the database"
          - alert: ValkeyErrors
            expr: increase(mathboard_bus_errors_total[5m]) > 0
            annotations:
              summary: "{{ $labels.pod }} is failing to reach Valkey ({{ $labels.operation }}); replicas fall back to the database"
          - alert: DatabasePoolNearLimit
            expr: mathboard_db_pool_connections_in_use / mathboard_db_pool_connections_limit > 0.8
            for: 2m
            annotations:
              summary: "{{ $labels.pod }} is using over 80% of its database connection budget"
