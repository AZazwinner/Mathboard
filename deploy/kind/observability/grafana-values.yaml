# Viewing needs no login (anonymous Viewer). The admin password, needed only to edit, is in the
# generated secret: bash deploy/kind/observability.sh grafana prints how to read it.
grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  users:
    default_theme: dark

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: mathboard
        folder: Mathboard
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/mathboard

# The dashboard JSON lives in the repo; observability.sh turns it into this ConfigMap.
dashboardsConfigMaps:
  mathboard: mathboard-dashboards
