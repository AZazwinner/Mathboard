# A base backup every night at 02:00 UTC. Between base backups, WAL is archived continuously, which is what
# makes restoring to any moment (not just to a backup) possible. Note the six fields: CNPG's cron has seconds.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mathboard-nightly
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: mathboard-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
