# Where the Barman Cloud plugin sends base backups and archived WAL. Credentials come from the backup-s3
# Secret that backups.sh creates.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mathboard-backups
spec:
  # Recovery points older than this are deleted.
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://backups/
    endpointURL: http://seaweedfs:8333
    s3Credentials:
      accessKeyId:
        name: backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # Newer boto3 adds checksum headers that some S3-compatible stores reject; only send them when required.
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
