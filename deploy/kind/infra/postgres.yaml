apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mathboard-db
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: mathboard
      owner: mathboard
